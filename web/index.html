<!doctype html>
<html lang="vi">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bản đồ 3D Đà Nẵng</title>
    <style>
      html, body {
        margin: 0;

        overflow: hidden;
        background: #0b0f14;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #info-panel {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        background: rgba(10, 14, 20, 0.65);
        color: #e8edf2;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        border-radius: 8px;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="info-panel">Bản đồ 3D Đà Nẵng — đang tải địa danh...</div>
    <script type="module" src="/src/main.js"></script>
